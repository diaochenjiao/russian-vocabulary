name: Build Android APK
on:
  push:
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: echo "ANDROID_HOME=$ANDROID_HOME"
      - run: npm ci
        working-directory: mobile
      - run: npx vitest run
        working-directory: mobile
      - run: npm run build && npx cap sync android
        working-directory: mobile
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: RussianVocabulary-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

